<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Картка товару</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-stone-100 dark:bg-stone-950 flex items-center justify-center p-4 font-sans">

  <article class="w-full max-w-sm overflow-hidden rounded-2xl bg-white dark:bg-stone-900 shadow-lg ring-1 ring-stone-200 dark:ring-stone-800">

    <div class="relative aspect-video bg-gradient-to-br from-teal-100 to-emerald-200 dark:from-teal-900 dark:to-emerald-950">
      <svg class="absolute inset-0 m-auto h-24 w-24 text-teal-700 dark:text-teal-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 15v-3a8 8 0 0 1 16 0v3"/>
        <rect x="3" y="14" width="4" height="6" rx="1.5"/>
        <rect x="17" y="14" width="4" height="6" rx="1.5"/>
      </svg>
      <span class="absolute left-3 top-3 rounded-full bg-emerald-600 px-3 py-1 text-xs font-semibold text-white shadow">Новинка</span>
    </div>

    <div class="space-y-3 p-5">
      <h2 class="text-lg font-semibold leading-snug text-stone-900 dark:text-stone-50">
        Бездротові навушники Aura X2 з шумопоглинанням
      </h2>

      <p class="flex items-baseline gap-3">
        <span class="text-sm text-stone-400 line-through">4 999 ₴</span>
        <span class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">3 799 ₴</span>
      </p>

      <button type="button" class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-semibold text-white transition hover:bg-emerald-700 active:scale-95 focus:outline-none focus-visible:ring-4 focus-visible:ring-emerald-300">
        В кошик
      </button>
    </div>

  </article>

</body>
</html>
